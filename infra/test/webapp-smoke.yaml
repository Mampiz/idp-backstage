# F0 smoke test resource.
#
# Two constraints the operator imposes on anything it admits, both learned the
# hard way from its own admission chain:
#
#   1. Tags must be explicit and immutable. The validating webhook
#      (internal/webhook/v1/webapp_webhook.go -> validateImageTag) rejects
#      ":latest" and implicit tags alike.
#   2. The container cannot bind a privileged port. The operator drops ALL
#      capabilities by default, so CAP_NET_BIND_SERVICE is gone and a stock
#      nginx listening on :80 exits with code 1 on startup. Its own
#      config/samples/platform_v1_webapp.yaml documents this and uses the
#      unprivileged image on 8080, which is what we do here.
apiVersion: platform.miportfolio.com/v1
kind: WebApp
metadata:
  name: smoke-test
  namespace: idp-demo
spec:
  image: nginxinc/nginx-unprivileged:1.27-alpine
  replicas: 2
  port: 8080
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    cpuThresholdPercent: 70
