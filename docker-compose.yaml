# Postgres backing Backstage. The catalog must survive restarts, so the data
# lives in a named volume, not in the container's writable layer (and certainly
# not in the in-memory SQLite the create-app template ships with).
#
# Credentials come from .env (gitignored); the defaults below are local-only.
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - idp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage} -d ${POSTGRES_DB:-backstage}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backstage cannot discover the repositories of a personal GitHub account
  # (its provider only queries organizations), so this Go service does it and
  # hands Backstage a Location entity. GITHUB_TOKEN is passed through from the
  # shell environment and is never written to a file.
  scaffolder:
    build:
      context: ./services/scaffolder
    container_name: idp-scaffolder
    restart: on-failure:3
    environment:
      # Empty default on purpose: compose interpolates the whole file, so a hard
      # requirement here would break "docker compose up postgres" too. The
      # service itself fails loudly on an empty token, and the Makefile has a
      # require-github-token guard in front of the targets that need it.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-Mampiz}
      SCAFFOLDER_ADDR: ":8082"
    ports:
      - "8082:8082"

volumes:
  idp-pgdata:
    name: idp-pgdata
